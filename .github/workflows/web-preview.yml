name: Build web preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export Expo Web
        run: npx expo export --platform web
        env:
          CI: '1'
      - name: Archive preview build
        uses: actions/upload-artifact@v4
        with:
          name: gyohwanjeom-web-preview
          path: dist
          retention-days: 7
